<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>YYC Radar</title>
  <script src="https://unpkg.com/deck.gl@9.1.12/dist.min.js"></script>
  <script src="https://unpkg.com/@deck.gl/extensions@9.1.12/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: sans-serif; }
    #map { width: 100vw; width: 100dvw; height: 100vh; height: 100dvh; position: absolute; top: 0; left: 0; pointer-events: auto;}
    
    #control-panel {
      position: absolute; top: 40px; left: 20px; z-index: 100;
      background: rgba(20, 20, 20, 0.85); border-radius: 8px;
      color: #fff; width: 220px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      overflow: hidden; 
    }

    .panel-header {
      padding: 10px 15px; background: rgba(40, 40, 40, 0.9); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; font-weight: bold; letter-spacing: 0.5px; border-bottom: 1px solid #333;
    }
    .panel-header:hover { background: #444; }
    .panel-content { padding: 15px; max-height: 80vh; overflow-y: auto; transition: all 0.4s; }
    #control-panel.collapsed .panel-content { max-height: 0; padding-top: 0; padding-bottom: 0; border: none; }
    .toggle-icon { transition: transform 0.4s; font-size: 11px; color: #0076ff; }
    #control-panel.collapsed .toggle-icon { transform: rotate(180deg); }

    .panel-section { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .panel-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .panel-section label { display: block; font-size: 12px; color: #aaa; margin-bottom: 3px; }
    
    .btn-group { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 4px; 
      width: 100%; 
    }
    
    .btn-group-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      width: 100%;
    }
    
    .btn {
      flex: 1; background: #333; color: #fff; border: none; padding: 4px 0;
      border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s; text-align: center;
    }
    .btn.active { background: #0076ff; font-weight: bold; }
    
    .rwy-btn { 
      width: 100%; 
      margin-top: 0; 
      background: #222; 
      border: 1px solid #444; 
      font-weight: normal; 
    }
    .rwy-btn.active { background: #0076ff; color: #fff; font-weight: bold; border-color: #0076ff; }

    .btn.save-btn { 
      background: #dc3545; color: #fff; font-weight: bold; font-size: 12px; 
      margin: 5px auto 0 auto; padding: 5px 0; display: block; width: 75%; border-radius: 4px;
    }
    .btn.save-btn:hover { background: #bd2130; }
    select { width: 100%; background: #333; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 11px; }

    input[type=range] { width: 100%; cursor: pointer; }

    .control-btn {
      position: absolute; right: 20px; z-index: 100;
      background: rgba(20, 20, 20, 0.3); color: #0076ff; border: 1px solid #0076ff;
      padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 118, 255, 0.3); transition: all 0.2s; width: 90px; text-align: center;
    }
    .control-btn:hover { background: #0076ff; color: #fff; box-shadow: 0 0 15px rgba(0, 118, 255, 0.3); }
    #compass-btn { top: 40px; }
    #topview-btn { top: 95px; }
    #yyc-btn { top: 150px; }
    #yyc-btn.active { background: #0076ff; color: #fff; box-shadow: 0 0 15px rgba(0, 118, 255, 0.8); }

    .control-btn:active, #yyc-btn:active {
      background: #ff00ff !important; border-color: #ff00ff !important; color: #000000 !important;
      box-shadow: 0 0 15px #ff00ff !important; transition: none !important;
    }
    
    #bottom-timeline-panel {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      width: 85vw; max-width: 1200px; z-index: 100;
      box-sizing: border-box;
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      opacity: 1.0 !important; 
      padding: 25px 0 10px 0; 
    }

    #bottom-timeline-panel.hidden { display: none !important; }

    .timeline-header-grid { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .timeline-title { font-size: 12px; font-weight: bold; color: #0076ff; letter-spacing: 1px; }
    .timeline-selection-display {
      font-size: 14px; font-weight: bold; color: #0076ff; background: rgba(0, 118, 255, 0.1);
      padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(0, 118, 255, 0.3);
    }
    .slider-wrapper { padding: 0 10px; margin-bottom: 8px; }
    
    .timeline-edges { display: flex; justify-content: space-between; margin-top: 12px; }
    .timeline-edges div {
      display: inline-flex;
      align-items: center;
      background: rgba(10, 10, 10, 0.7); 
      border-radius: 4px;
      border: 1px solid rgba(0, 118, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 118, 255, 0.2);
    }

    .timeline-edges span { 
      font-family: monospace; font-size: 14px; font-weight: bold; color: #ffffff;           
      padding: 4px 6px; 
      position: relative;
    }

    #label-left-time { color: #ffffff; padding-right: 4px; }
    #abs-start-time { padding-left: 4px; }
    #abs-end-time { padding-right: 4px; }
    #label-right-time { color: #ffffff; padding-left: 4px; }

    #label-left-time::before {
      content: ''; position: absolute; top: -15px; left: 5px;       
      border-width: 0 6px 15px 6px; border-style: solid;
      border-color: transparent transparent rgba(10, 10, 10, 0.7) transparent; 
      display: block; width: 0; height: 0;
    }

    #label-right-time::before {
      content: ''; position: absolute; top: -15px; right: 5px;      
      border-width: 0 6px 15px 6px; border-style: solid;
      border-color: transparent transparent rgba(10, 10, 10, 0.7) transparent; 
      display: block; width: 0; height: 0;
    }
    
    #bottom-timeline-panel .noUi-target { background: #222; border: 1px solid #444; border-radius: 6px; height: 10px; }
    #bottom-timeline-panel .noUi-connect { background: linear-gradient(90deg, #0056b3, #0076ff); }
    #bottom-timeline-panel .noUi-handle {
      width: 20px !important; height: 20px !important; right: -10px !important; top: -6px !important;
      background: #0076ff; border: 2px solid #fff; border-radius: 4px;
      box-shadow: 0 0 8px rgba(0,118,255,1); cursor: pointer; transition: transform 0.1s;
    }
    #bottom-timeline-panel .noUi-handle:hover { transform: scale(1.15); background: #248aff; }
    #bottom-timeline-panel .noUi-handle:before, #bottom-timeline-panel .noUi-handle:after { display: none; }

    #bottom-timeline-panel .noUi-tooltip {
      display: block; background: #0076ff; color: #fff; border: 1px solid #fff; border-radius: 4px;
      padding: 4px 8px; font-size: 12px; font-weight: bold; font-family: monospace; bottom: 24px; 
      box-shadow: 0 0 8px rgba(0, 118, 255, 0.6); white-space: nowrap;
    }
    #bottom-timeline-panel .noUi-tooltip:after {
      content: ''; position: absolute; border-width: 5px 5px 0; border-style: solid;
      border-color: #0076ff transparent; display: block; width: 0; bottom: -5px; left: 50%; transform: translateX(-50%);
    }

    #detail-panel {
      position: absolute; top: 210px; right: 20px; z-index: 100;
      background: rgba(20, 20, 20, 0.75); border-radius: 8px;
      color: #fff; width: 200px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(0, 118, 255, 0.3); display: none; 
    }
    .detail-header {
      padding: 10px 15px; background: rgba(0, 118, 255, 0.2); font-size: 13px; font-weight: bold;
      letter-spacing: 0.5px; border-bottom: 1px solid rgba(0, 118, 255, 0.4); display: flex; justify-content: space-between;
    }
    .detail-close { cursor: pointer; color: #aaa; }
    .detail-close:hover { color: #fff; }
    .detail-content { padding: 15px; font-family: monospace; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .detail-label { color: #ffffff; }
    .detail-value { color: #00ffc4; font-weight: bold; }
    .status-active { color: #00ff66; }
    .status-lost { color: #ff3366; }
  </style>
</head>
<body>

  <div id="detail-panel">
    <div class="detail-header">
      <span>✈️ AIRCRAFT INFO</span>
      <span class="detail-close" onclick="closeDetailPanel()">✖</span>
    </div>
    <div class="detail-content">
      <div class="detail-row"><span class="detail-label">ICAO Hex:</span><span id="det-hex" class="detail-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Callsign:</span><span id="det-callsign" class="detail-value" style="color:#fff;">-</span></div>
      <div class="detail-row"><span class="detail-label">Airline:</span><span id="det-airline" class="detail-value" style="color:#ffb000;">-</span></div>
      <div class="detail-row"><span class="detail-label">Model:</span><span id="det-model" class="detail-value" style="color:#00d2ff;">-</span></div>
      <div class="detail-row"><span class="detail-label">Reg:</span><span id="det-reg" class="detail-value" style="color:#ffffff;">-</span></div>
      <div class="detail-row"><span class="detail-label">Status:</span><span id="det-status" class="detail-value">-</span></div>
      <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
      <div class="detail-row"><span class="detail-label">Altitude:</span><span id="det-alt" class="detail-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Speed:</span><span id="det-speed" class="detail-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Heading:</span><span id="det-track" class="detail-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Vert Rate:</span><span id="det-vrate" class="detail-value">-</span></div>
    </div>
  </div>
    
  <button id="compass-btn" class="control-btn" onclick="resetToNorth()">北を上に</button>
  <button id="topview-btn" class="control-btn" onclick="setViewToTop()">真上から</button>
  <button id="yyc-btn" class="control-btn" onclick="toggleYycLock()">YYC</button>

  <div id="control-panel" class="collapsed">
    <div class="panel-header" onclick="togglePanel()">
      <span>📡 RADAR CONTROL</span>
      <span id="toggle-btn" class="toggle-icon">▲</span>
    </div>
    
    <div class="panel-content">
      <div class="panel-section">
        <label>📐 Line Thickness: <span id="width-val">1</span></label>
        <input type="range" id="width-slider" min="1" max="5" step="1" value="1" oninput="updateLineWidth(this.value)">
      </div>
      
      <div class="panel-section">
        <label>🌐 Control Zone: <span id="airspace-opacity-val">15</span>%</label>
        <input type="range" id="airspace-opacity-slider" min="0" max="30" step="5" value="15" oninput="updateAirspaceOpacity(this.value)">
        
        <!-- YBW-CZ / YYC-CZ トグルボタン -->
        <div class="btn-group-2" style="margin-top: 8px; margin-bottom: 6px;">
          <button id="btn-airspace-CYBW_CZ" class="btn rwy-btn active" onclick="toggleAirspace('CYBW_CZ')">YBW-CZ</button>
          <button id="btn-airspace-CYYC_CZ" class="btn rwy-btn active" onclick="toggleAirspace('CYYC_CZ')">YYC-CZ</button>
        </div>
        
        <!-- Inner / Middle / Outer トグルボタン -->
        <div class="btn-group">
          <button id="btn-airspace-TCA_INNER" class="btn rwy-btn" onclick="toggleAirspace('TCA_INNER')">Inner</button>
          <button id="btn-airspace-TCA_MIDDLE" class="btn rwy-btn" onclick="toggleAirspace('TCA_MIDDLE')">Middle</button>
          <button id="btn-airspace-TCA_OUTER" class="btn rwy-btn" onclick="toggleAirspace('TCA_OUTER')">Outer</button>
        </div>
      </div>
      
      <div class="panel-section">
        <label>🛬 Approach Path</label>
        <div class="btn-group">
          <button id="btn-rwy-17R" class="btn rwy-btn" onclick="toggleRunway('17R')">17R</button>
          <button id="btn-rwy-17L" class="btn rwy-btn" onclick="toggleRunway('17L')">17L</button>
          <button id="btn-rwy-11" class="btn rwy-btn" onclick="toggleRunway('11')">11</button>
          <button id="btn-rwy-35L" class="btn rwy-btn" onclick="toggleRunway('35L')">35L</button>
          <button id="btn-rwy-35R" class="btn rwy-btn" onclick="toggleRunway('35R')">35R</button>
          <button id="btn-rwy-29" class="btn rwy-btn" onclick="toggleRunway('29')">29</button>
        </div>
      </div>

      <div class="panel-section">
        <label>⛰️ Alt Exaggeration: <span id="exag-val">4</span>X</label>
        <input type="range" id="exag-slider" min="0" max="8" step="1" value="4" oninput="updateExaggeration(this.value)">
      </div>

      <!-- <div class="panel-section">
        <label>🏷️ Reduce Place Labels: <span id="label-density-val">4</span></label>
        <input type="range" id="label-density-slider" min="0" max="4" step="1" value="4" oninput="updateLabelDensity(this.value)">
      </div> -->

      <div class="panel-section">
        <label>🗺️ Map Style</label>
        <div class="btn-group">
          <button id="style-cyber" class="btn" onclick="switchMapStyle('cyber')">Dark</button>
          <button id="style-backdrop" class="btn active" onclick="switchMapStyle('backdrop')">Light</button>
          <button id="style-satellite" class="btn" onclick="switchMapStyle('satellite')">Satellite</button>
        </div>
      </div>
      
      <div class="panel-section">
        <label>🔄 Display Mode</label>
        <div class="btn-group">
          <button id="btn-mode-live" class="btn active" onclick="switchViewMode('live')">Live<br>Traffic</button>
          <button id="btn-mode-rt" class="btn" onclick="switchViewMode('realtime')">Current<br>Log</button>
          <button id="btn-mode-arch" class="btn" onclick="switchViewMode('archive')">Saved<br>Log</button>
        </div>
      </div>

      <div class="panel-section" id="archive-select-section" style="display: none;">
        <label>📁 Select Saved Arh</label>
        <select id="archive-list" onchange="loadSelectedArchive(this.value)">
          <option value="">-- Select Archive --</option>
        </select>
      </div>

      <div class="panel-section" style="padding-bottom: 0; border-bottom: none;">
        <button id="save-snapshot-btn" class="btn save-btn" onclick="saveCurrentTimespan()">Save This Time Span</button>
      </div>

      <div class="panel-section" id="cone-size-section" style="display: none;">
        <label>✈️ Aircraft Size: <span id="cone-size-val">12</span>px</label>
        <input type="range" id="cone-size-slider" min="8" max="36" step="4" value="12" oninput="updateConeSize(this.value)">
      </div>
    </div>
  </div>

  <div id="bottom-timeline-panel" class="hidden">
    <div class="slider-wrapper">
      <div id="timespan-range-slider"></div>
    </div>
    
    <div class="timeline-edges">
      <div>
        <span id="label-left-time">--h:</span> 
        <span id="abs-start-time">--:--:--</span> 
      </div>
      <div>
        <span id="abs-end-time">--:--:--</span> 
        <span id="label-right-time">:NOW</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const NM_TO_M = 1852;
    const FT_TO_M = 0.3048;

    const YYC_CENTER = [-114.0133, 51.1228];
    const CYYC_CENTER = [-114.0133, 51.1228]; 
    const CYBW_CENTER = [-114.3744, 51.1031];

    let YYC_ALTITUDE = 3557; //or 3606
    let YBW_ALTITUDE = 3940
    let EXAGGERATION_FACTOR = 4.0;
    let CONE_TARGET_PIXEL_LENGTH = 12; // 機体マーカーの画面上での目標の長さ(px)。スライダーで調整
    let AIRSPACE_OPACITY = 0.15; 
  
    let airspaceVisibility = {
        "CYBW_CZ": true,
        "CYYC_CZ": true,
        "TCA_INNER": false,
        "TCA_MIDDLE": false,
        "TCA_OUTER": false
    };

    // airport: どの空港の滑走路かを示す（将来YBWの滑走路を追加する際は 'CYBW' を指定する）
    let YYC_RUNWAYS = [
      { id: '11',  airport: 'CYYC', center: [-114.03646743029697, 51.126731789097676], heading: 120.142261, active: false, color: [0, 255, 0] },
      { id: '29',  airport: 'CYYC', center: [-114.0063297003938, 51.11574234044246], heading: 360-59.857738, active: false, color: [0, 255, 0] },
      { id: '17R', airport: 'CYYC', center: [-114.02133463605998, 51.13139889952143], heading: 180, active: false, color: [0, 255, 0] },
      { id: '35L', airport: 'CYYC', center: [-114.0213797307343, 51.09665392784393], heading: 0, active: false, color: [0, 255, 0] },
      { id: '17L', airport: 'CYYC', center: [-113.9903239279564, 51.1485966715133], heading: 180, active: false, color: [0, 255, 0] },
      { id: '35R', airport: 'CYYC', center: [-113.99037210622825, 51.110237118893124], heading: 0, active: false, color: [0, 255, 0] }
    ];

    const currentHost = window.location.hostname;
    const isActualMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent) || 
                           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    let IS_NATIVE = window.location.port === '8056' || window.location.port === '8060' || currentHost.includes('cloudflare');
    let HTTP_BASE = IS_NATIVE ? '' : 'http://localhost:8056';
    let WS_BASE   = IS_NATIVE ? `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}` : 'ws://localhost:8056';
    let ws = null; 

    const STYLES = {
      cyber: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      backdrop: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      satellite: {
        version: 8,
        sources: {
          'esri-satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Tiles &copy; Esri'
          }
        },
        layers: [
          { id: 'esri-satellite-layer', type: 'raster', source: 'esri-satellite', minzoom: 0, maxzoom: 20 }
        ]
      }
    };

    let currentStyleName = 'backdrop'; 
    let currentLineWidth = 1; 
    let sliderStartHours = -12.0; 
    let sliderEndHours = 0.0; 
    const MASTER_START_HOURS = sliderStartHours;

    let viewMode = 'live'; 
    let currentArchiveData = []; 
    
    let liveFlightPaths = {};     
    let archiveFlightPaths = {};  
    let flightPaths = liveFlightPaths; 

    // ==========================================
    // 設定の保存・復元 (localStorage、キー名: radar_setting)
    // ブラウザ内(この端末・このブラウザのみ)に保存され、次回開いた時に自動的に復元される。
    // ==========================================
    const SETTINGS_STORAGE_KEY = 'radar_setting';
    let settingsRestoring = false; // 復元中の一時的な変更でsaveRadarSettingsが呼ばれるのを防ぐフラグ

    function saveRadarSettings() {
      if (settingsRestoring) return;
      try {
        const settings = {
          mapStyle: currentStyleName,
          exaggeration: EXAGGERATION_FACTOR,
          lineWidth: currentLineWidth,
          airspaceOpacity: AIRSPACE_OPACITY,
          airspaceVisibility: airspaceVisibility,
          runwayActive: Object.fromEntries(YYC_RUNWAYS.map(r => [r.id, r.active])),
          aircraftSize: CONE_TARGET_PIXEL_LENGTH,
          viewMode: viewMode,
          camera: map ? {
            center: [map.getCenter().lng, map.getCenter().lat],
            zoom: map.getZoom(),
            pitch: map.getPitch(),
            bearing: map.getBearing()
          } : null
        };
        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
      } catch (e) {
        console.log('ℹ️ 設定の保存に失敗しました', e);
      }
    }

    function loadRadarSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        console.log('ℹ️ 設定の読み込みに失敗しました', e);
        return null;
      }
    }

    // mapのカメラ位置は移動のたびに毎回保存すると負荷が高いので、
    // 移動が落ち着いた時(moveend)だけ保存する
    function setupSettingsAutoSave() {
      map.on('moveend', saveRadarSettings);
    }

    let selectedAircraftId = null;

    function formatToCalgaryTime(timestamp) {
      if (timestamp < 10000000000) timestamp *= 1000;
      const date = new Date(timestamp);
      const utc = date.getTime() + (date.getTimezoneOffset() * 60000);
      const month = date.getUTCMonth() + 1;
      const calgaryOffsetHours = (month >= 3 && month <= 11) ? -6 : -7;
      const calgaryDate = new Date(utc + (3600000 * calgaryOffsetHours));
      
      const hh = String(calgaryDate.getHours()).padStart(2, '0');
      const mm = String(calgaryDate.getMinutes()).padStart(2, '0');
      const ss = String(calgaryDate.getSeconds()).padStart(2, '0');
      
      return `${hh}:${mm}:${ss}`;
    }

    const minSliderRange = isActualMobile ? -2 : -24;
    sliderStartHours = isActualMobile ? -2.0 : -12.0; 

    const rangeSlider = document.getElementById('timespan-range-slider');
    noUiSlider.create(rangeSlider, {
        start: [sliderStartHours, sliderEndHours], 
        connect: true,
        step: 0.25, 
        tooltips: [true, true], 
        range: { 'min': minSliderRange, 'max': 0 }, 
        format: {
            to: function (value) {
                let baseTime = Date.now();
                if (viewMode === 'archive' && currentArchiveData.length > 0) {

    function getColorByAltitude(rawAlt) {
      let currentMinAlt = YYC_ALTITUDE * FT_TO_M * 0.0; 
      let currentMaxAlt = 40000 * FT_TO_M; 
      const ratio = Math.min(Math.max((rawAlt - currentMinAlt) / (currentMaxAlt - currentMinAlt), 0), 1);
      return [
        Math.round(255 * (1 - ratio)),
        Math.round(200 * (1 - Math.abs(ratio - 0.5) * 2)),
        Math.round(255 * ratio),
        224
      ];
    }

    // 機体本体(markerLayer)だけに使う、高度色を明るくしたバージョン。
    // 軌跡(pathLayer)の色はgetColorByAltitudeのまま変えず、機体だけをDarkスタイルの背景から
    // 浮き上がって見えるようにするため、各色成分を白に近づける(ブレンドする)形で明るくしている。
    const AIRCRAFT_COLOR_BRIGHTEN_RATIO = 0.45; // 0=元の色のまま、1=完全に白
    function getBrightColorByAltitude(rawAlt) {
      const [r, g, b, a] = getColorByAltitude(rawAlt);
      const brighten = (c) => Math.round(c + (255 - c) * AIRCRAFT_COLOR_BRIGHTEN_RATIO);
      return [brighten(r), brighten(g), brighten(b), a];
    }

    // Dark(cyber)・Satelliteスタイルは背景が暗い/ごちゃついているため、
    // 高度による色分けよりも視認性を優先し、機体を単色(黄色)にする。
    // Light(backdrop)スタイルは背景が明るいので、これまで通り高度色を使う。
    const AIRCRAFT_SOLID_COLOR = [255, 221, 0, 255]; // 黄色
    function getAircraftColor(rawAlt) {
      if (currentStyleName === 'cyber' || currentStyleName === 'satellite') {
        return AIRCRAFT_SOLID_COLOR;
      }
      return getBrightColorByAltitude(rawAlt);
    }

    // 現在のマップカメラを基準に、各機体の「カメラからの距離」に応じたサイズ補正倍率を計算する。
    // deck.glのpixels単位だけではpitch(視点の傾き)による遠近スケールが完全には打ち消されないため、
    // 画面中心(基準距離)に対する相対距離の逆数を掛けて、近い/遠いマーカーの見た目サイズを揃える。
    function computeAircraftScaleFactors(positionsArray) {
      const scales = {};
      if (!map || positionsArray.length === 0) return scales;

      const container = map.getContainer();
      const viewport = new deck.WebMercatorViewport({
        width: container.clientWidth,
        height: container.clientHeight,
        longitude: map.getCenter().lng,
        latitude: map.getCenter().lat,
        zoom: map.getZoom(),
        pitch: map.getPitch(),
        bearing: map.getBearing()
      });

      const cameraPos = viewport.cameraPosition; // [x, y, z] カメラのcommon空間座標
      const centerCommon = viewport.projectPosition([viewport.longitude, viewport.latitude, 0]);
      const dist3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
      const refDistance = dist3(cameraPos, centerCommon);

      positionsArray.forEach(d => {
        const p = viewport.projectPosition(d.pos);
        const dist = dist3(cameraPos, p);
        // 遠くのものほど1より大きく、近くのものほど1より小さい倍率になる
        let scale = dist > 0 ? (dist / refDistance) : 1;
        // 極端な値で見た目が破綻しないようクランプ
        scale = Math.min(Math.max(scale, 0.3), 3);
        scales[d.id] = scale;
      });

      return scales;
    }

    // 空港ごとの標高(ft ASL)。将来YBWのアプローチラインを追加する場合は、
    // 対象の滑走路データに airport: 'CYBW' を設定するだけで、ここから正しい標高が自動的に使われる。
    const AIRPORT_ELEVATION_FT = {
      CYYC: YYC_ALTITUDE,
      CYBW: YBW_ALTITUDE
    };

    // 保存済みポイントのrawAltを安全に取得する（欠損・NaNの古いデータが混じっていても軌跡描画がNaNで壊れないようにする）
    function safeAlt(pt) {
      return (pt.rawAlt !== undefined && !isNaN(pt.rawAlt)) ? Number(pt.rawAlt) : 0;
    }

    // 直近の位置履歴(points)から、3次元の進行方向（水平方向のヨーと、昇降によるピッチ）を計算する。
    // points が短い/移動距離が小さい（停止中・ノイズレベル）場合は、
    // ADS-Bのtrack(コンパス角度)にフォールバックし、ピッチは0(水平)とする。
    function computeAircraftOrientation(points, fallbackYawDeg, exag) {
      const HISTORY_POINTS = 5; // 直近何点から向きを計算するか
      if (!points || points.length < 2) {
        return { yaw: fallbackYawDeg, pitch: 0 };
      }

      const recent = points.slice(-HISTORY_POINTS);
      const p1 = recent[0];
      const p2 = recent[recent.length - 1];

      const lon1 = Number(p1.pos[0]), lat1 = Number(p1.pos[1]);
      const lon2 = Number(p2.pos[0]), lat2 = Number(p2.pos[1]);
      if (isNaN(lon1) || isNaN(lat1) || isNaN(lon2) || isNaN(lat2)) {
        return { yaw: fallbackYawDeg, pitch: 0 };
      }

      const avgLatRad = ((lat1 + lat2) / 2) * Math.PI / 180;
      const dx = (lon2 - lon1) * 111320 * Math.cos(avgLatRad); // 東西方向の移動量(m)
      const dy = (lat2 - lat1) * 110540;                        // 南北方向の移動量(m)
      const horizDist = Math.hypot(dx, dy);

      // 移動距離が小さすぎる（地上で停止中・GPSノイズレベル）場合はコンパス角度にフォールバック
      if (horizDist < 5) {
        return { yaw: fallbackYawDeg, pitch: 0 };
      }

      // 高度差は「描画上の」値（EXAGGERATION_FACTORを反映）で計算する。
      // これにより、円錐の向きが実際に描画される経路の傾きと視覚的に一致する。
      const dz = (safeAlt(p2) - safeAlt(p1)) * exag;

      const yaw = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
      let pitch = Math.atan2(dz, horizDist) * 180 / Math.PI;
      pitch = Math.max(-85, Math.min(85, pitch)); // 極端な値での見た目の破綻を防ぐ

      return { yaw, pitch };
    }

    // ==========================================
    // 機体マーカー用の飛行機メッシュ（胴体+主翼+垂直尾翼、進行方向を向く3D立体）
    // ==========================================
    // 機首(現在位置)を原点(0,0,0)、そこから -X 方向に胴体が伸びる。
    // SimpleMeshLayerのgetOrientationは [pitch, yaw, roll]（度）で、
    // yawは+Z軸（真上）まわりの回転。このメッシュは「+X = 機首方向」で作ってあるので、
    // getOrientationのyawに角度を渡すとその方向へ機首が向く。
    //
    // 重要: 機体の中心軸(機首-尾部を結ぶ軸)は、pitch(ピッチ)の回転軸と
    // 一致させてはいけない（軸が一致していると、軸まわりに回転させても
    // 見た目が変わらない形の場合はピッチの値を変えても視覚的な変化が出ない）。
    // 胴体をX軸に通しつつ、主翼・尾翼で非対称な形にしているため、この問題は起きない。
    function createAircraftMesh(lengthMeters) {
      const positions = [];
      const normals = [];

      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const cross = (a, b) => [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
      const normalize = (v) => {
        const len = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / len, v[1] / len, v[2] / len];
      };
      // 1枚の三角形を追加。
      // 法線(面の向き)は本来3頂点から計算するが、material:false / effects:[] でも
      // 陰影(面ごとの明暗差)が消えなかったため、全ての面の法線を強制的に同じ向き([0,0,1]、真上)に
      // 統一することで、面の向きに関わらず均一な色になるようにしている。
      const UNIFORM_NORMAL = [0, 0, 1];
      const pushTri = (p0, p1, p2) => {
        positions.push(...p0, ...p1, ...p2);
        normals.push(...UNIFORM_NORMAL, ...UNIFORM_NORMAL, ...UNIFORM_NORMAL);
      };
      // 主翼・尾翼のような「厚みのない板」を、表からも裏からも見えるように両面分追加する
      const pushTriBothSides = (p0, p1, p2) => {
        pushTri(p0, p1, p2);
        pushTri(p0, p2, p1);
      };

      // ------ 寸法（実機の縮尺ではなく、レーダー表示として見やすいようデフォルメ） ------
      const L = lengthMeters;
      const nose = [0, 0, 0];
      const tail = [-L, 0, 0];

      // 胴体: 先端(nose)・後端(tail)は尖った四角錐、その間に断面が一定の四角柱(ボックス)を挟んだ形状。
      // 前後2つの断面(bodyFrontX側・bodyBackX側)を作り、間を4枚の側面パネルでつないで箱にし、
      // その前後をnose/tailへの三角形でつなげている。
      const bodyFrontX = -L * 0.15; // 箱の前端(nose寄り)の位置
      const bodyBackX  = -L * 0.75; // 箱の後端(tail寄り)の位置
      const bodyHalfWidth = L * 0.06;
      const bodyHalfHeight = L * 0.06;

      const bTopF    = [bodyFrontX, 0, bodyHalfHeight];
      const bBottomF = [bodyFrontX, 0, -bodyHalfHeight];
      const bLeftF   = [bodyFrontX, -bodyHalfWidth, 0];
      const bRightF  = [bodyFrontX, bodyHalfWidth, 0];

      const bTopB    = [bodyBackX, 0, bodyHalfHeight];
      const bBottomB = [bodyBackX, 0, -bodyHalfHeight];
      const bLeftB   = [bodyBackX, -bodyHalfWidth, 0];
      const bRightB  = [bodyBackX, bodyHalfWidth, 0];

      // 胴体前部(nose → 前側断面)。法線の向き(巻き順)に関わらずどこからでも見えるよう両面描画
      pushTriBothSides(nose, bRightF, bTopF);
      pushTriBothSides(nose, bTopF, bLeftF);
      pushTriBothSides(nose, bLeftF, bBottomF);
      pushTriBothSides(nose, bBottomF, bRightF);

      // 胴体中央部(前側断面 → 後側断面、四角柱の側面4枚)。こちらも両面描画
      const pushBodyQuad = (a, b, c, d) => { // a,b,c,d を反時計回り(nose側から見て)で渡す
        pushTriBothSides(a, b, c);
        pushTriBothSides(a, c, d);
      };
      pushBodyQuad(bRightF, bTopF, bTopB, bRightB);       // 右上パネル
      pushBodyQuad(bTopF, bLeftF, bLeftB, bTopB);         // 左上パネル
      pushBodyQuad(bLeftF, bBottomF, bBottomB, bLeftB);   // 左下パネル
      pushBodyQuad(bBottomF, bRightF, bRightB, bBottomB); // 右下パネル

      // 胴体後部(後側断面 → tail)。こちらも両面描画
      pushTriBothSides(tail, bTopB, bRightB);
      pushTriBothSides(tail, bLeftB, bTopB);
      pushTriBothSides(tail, bBottomB, bLeftB);
      pushTriBothSides(tail, bRightB, bBottomB);

      // 主翼・水平尾翼共通: 翼根(機体側)から翼端にかけて後方にせり出す「後退翼」の台形を作る。
      // 旅客機のように、前縁(リーディングエッジ)がなだらかに後退し、翼端に向かって
      // コード幅(前後の厚み)も狭くなる形にしている。上下どちらから見ても見えるよう両面描画。
      const pushSweptWingPair = (rootX, rootY, halfSpan, sweep, rootChordFront, rootChordBack, tipChordFront, tipChordBack, z) => {
        const side = (sign) => {
          const rootLE = [rootX + rootChordFront, sign * rootY, z];
          const rootTE = [rootX - rootChordBack, sign * rootY, z];
          const tipLE  = [rootX + tipChordFront - sweep, sign * halfSpan, z];
          const tipTE  = [rootX - tipChordBack - sweep, sign * halfSpan, z];

          if (sign > 0) {
            pushTriBothSides(rootLE, tipLE, tipTE);
            pushTriBothSides(rootLE, tipTE, rootTE);
          } else {
            // 反対側は頂点の並び順(巻き順)を逆にして法線の向きを揃える
            pushTriBothSides(rootLE, tipTE, tipLE);
            pushTriBothSides(rootLE, rootTE, tipTE);
          }
        };
        side(1);  // 右側
        side(-1); // 左側
      };

      // 主翼
      const wingRootX = -L * 0.48;      // 翼根の基準X位置
      const wingRootY = L * 0.045;      // 翼根のY位置(胴体からの隙間)
      const wingHalfSpan = L * 0.42;    // 翼端までのY距離(半スパン)
      const wingSweep = L * 0.24;       // 後退角の大きさ(翼端が翼根よりどれだけ後方にずれるか)
      const wingRootChordFront = L * 0.09; // 翼根の前縁オフセット
      const wingRootChordBack  = L * 0.15; // 翼根の後縁オフセット
      const wingTipChordFront  = L * 0.02; // 翼端の前縁オフセット(翼根より小さい=先細り)
      const wingTipChordBack   = L * 0.06; // 翼端の後縁オフセット

      pushSweptWingPair(
        wingRootX, wingRootY, wingHalfSpan, wingSweep,
        wingRootChordFront, wingRootChordBack, wingTipChordFront, wingTipChordBack, 0
      );

      // 水平尾翼: 主翼よりひとまわり小さく、機体後部(垂直尾翼の付け根あたり)につく
      const htailRootX = -L * 0.95; //水平尾翼が胴体につく位置(X)
      const htailRootY = L * 0.00; //翼根と胴体中心のすき間
      const htailHalfSpan = L * 0.14; //	翼端までの半スパン(=尾翼の横幅)
      const htailSweep = L * 0.00; //後退角の強さ
      const htailRootChordFront = L * 0.1; //翼根の前縁の張り出し量
      const htailRootChordBack  = L * 0.0; //翼根の後縁の張り出し量
      const htailTipChordFront  = L * 0.00; //翼端の前縁の張り出し量
      const htailTipChordBack   = L * 0.05; //翼端の後縁の張り出し量

      pushSweptWingPair(
        htailRootX, htailRootY, htailHalfSpan, htailSweep,
        htailRootChordFront, htailRootChordBack, htailTipChordFront, htailTipChordBack, 0
      );

      // 垂直尾翼: 機体後部から立ち上がる四辺形(台形)。旅客機のように、
      // 底辺(付け根)は前後に長く、上に行くほど後退・先細りする形にしている。両面描画。
      const finBaseFront = [-L * 0.83, 0, 0];          // 底辺・前縁(付け根側)
      const finBaseBack  = [-L * 0.96, 0, 0];          // 底辺・後縁
      const finTopBack   = [-L * 1.00, 0, L * 0.18];   // 上辺・後縁(後縁はほぼ垂直)
      const finTopFront  = [-L * 0.95, 0, L * 0.18];   // 上辺・前縁(底辺の前縁より後退している)

      pushTriBothSides(finBaseFront, finBaseBack, finTopBack);
      pushTriBothSides(finBaseFront, finTopBack, finTopFront);

      // 原点(getPositionで渡す座標)を「機首」ではなく「機体の全長の中央」に合わせるため、
      // 全頂点のX座標を+L/2だけずらす（元は機首が0、尾部が-Lだったので、中央は-L/2 → 0になる）
      const CENTER_OFFSET_X = L / 2;
      for (let i = 0; i < positions.length; i += 3) {
        positions[i] += CENTER_OFFSET_X;
      }

      // indicesを使わず、3頂点ずつが1つの三角形になる「三角形の羅列」形式にする
      // （indices付きのメッシュを渡すと初期化エラーになったため）
      // さらに、各属性は glTF方式のアクセサ形式 { value: TypedArray, size: 要素数 } で渡す必要がある。
      // 生のFloat32Arrayをそのまま渡すと "t.value.length" のようなエラーで初期化に失敗する。
      const vertexCount = positions.length / 3;
      const texCoords = new Float32Array(vertexCount * 2); // テクスチャは使わないのでダミー値(0埋め)でよい

      return {
        positions: { value: new Float32Array(positions), size: 3 },
        normals: { value: new Float32Array(normals), size: 3 },
        texCoords: { value: texCoords, size: 2 }
      };
    }

    // 機首から尾部までの全長(メートル)。SimpleMeshLayerは実寸(メートル)で描画されるため、
    // ズームレベルに応じて見た目の大きさが変わる（＝実物の3D機体に近い自然な挙動）。
    // 小さすぎて見えない/大きすぎる場合はこの値を調整する。
    const AIRCRAFT_LENGTH_M = 1200; // 全長1200m
    const AIRCRAFT_MESH = createAircraftMesh(AIRCRAFT_LENGTH_M);

    // 進行方向(コンパス角度: 北=0°、時計回り)とメッシュのyaw回転方向を合わせるためのオフセット。
    // メッシュの先端は+X(東)方向がデフォルトの向きなので、北(+Y)を基準にするため90度補正している。
    // それでも向きが実際の進行方向とズレて見える場合は、90ずつ足し引きして調整する。
    const CONE_HEADING_OFFSET_DEG = 90;

    // アプローチパスを生成
    function generateApproachLine(rwy, exag) {
      const startLon = rwy.center[0];
      const startLat = rwy.center[1];
      const pathHeightAdjustment = -10; // 単位:ft
      // rwy.airport が未指定の滑走路データが来た場合はCYYCにフォールバック
      const airportKey = rwy.airport || 'CYYC';
      const airportElevationFt = AIRPORT_ELEVATION_FT[airportKey] !== undefined
        ? AIRPORT_ELEVATION_FT[airportKey]
        : YYC_ALTITUDE;
      const airportElevationMeters = (airportElevationFt + pathHeightAdjustment) * FT_TO_M ;
      const reverseHeadingRad = ((rwy.heading + 180) % 360) * Math.PI / 180;
      const distanceMeters = 10 * NM_TO_M; 
      const glideSlopeClimbMeters = distanceMeters * Math.sin(3 * Math.PI / 180); //角度３度
      const finalAltitudeMeters = airportElevationMeters + glideSlopeClimbMeters;

      const latLengthPerDegree = 111320;
      const lonLengthPerDegree = 40075000 * Math.cos(startLat * Math.PI / 180) / 360;

      const endLon = startLon + (Math.sin(reverseHeadingRad) * distanceMeters / lonLengthPerDegree);
      const endLat = startLat + (Math.cos(reverseHeadingRad) * distanceMeters / latLengthPerDegree);

      return [
        [startLon, startLat, airportElevationMeters * exag],
        [endLon, endLat, finalAltitudeMeters * exag]
      ];
    }

    // アプローチラインを「地面に置いた板を持ち上げただけ」に見えないよう、
    // 実際に厚み(width×thickness)を持つ直方体(ボックス)のメッシュとして生成する。
    // start(開始点)を原点(0,0,0)としたローカル座標(メートル)で8頂点のボックスを作り、
    // 呼び出し側でgetPositionにstart(実際の緯度経度・高度)を渡して配置する。
    function createApproachBoxMesh(start, end, widthMeters, thicknessMeters) {
      const avgLatRad = ((start[1] + end[1]) / 2) * Math.PI / 180;
      const dx = (end[0] - start[0]) * 111320 * Math.cos(avgLatRad); // 東西方向の距離(m)
      const dy = (end[1] - start[1]) * 110540;                        // 南北方向の距離(m)
      const dz = end[2] - start[2];                                   // 高度差(m、既にEXAGGERATION_FACTOR反映済み)

      const horizLen = Math.hypot(dx, dy) || 1;
      const dirX = dx / horizLen, dirY = dy / horizLen;
      const perpX = -dirY, perpY = dirX; // 進行方向に垂直な水平ベクトル(幅方向)

      const halfW = widthMeters / 2;

      // 底面をstart/endの高度(=YYC_ALTITUDE基準のライン)そのものに固定し、
      // そこから上方向にのみ厚み(thicknessMeters)を持たせる（中心基準ではない）
      const sBL = [-perpX * halfW, -perpY * halfW, 0];
      const sBR = [ perpX * halfW,  perpY * halfW, 0];
      const sTL = [-perpX * halfW, -perpY * halfW, thicknessMeters];
      const sTR = [ perpX * halfW,  perpY * halfW, thicknessMeters];
      const eBL = [dx - perpX * halfW, dy - perpY * halfW, dz];
      const eBR = [dx + perpX * halfW, dy + perpY * halfW, dz];
      const eTL = [dx - perpX * halfW, dy - perpY * halfW, dz + thicknessMeters];
      const eTR = [dx + perpX * halfW, dy + perpY * halfW, dz + thicknessMeters];

      const positions = [];
      const normals = [];
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const cross = (a, b) => [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
      const normalize = (v) => {
        const len = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / len, v[1] / len, v[2] / len];
      };
      const pushTri = (p0, p1, p2) => {
        const n = normalize(cross(sub(p1, p0), sub(p2, p0)));
        positions.push(...p0, ...p1, ...p2);
        normals.push(...n, ...n, ...n);
      };
      const pushQuad = (a, b, c, d) => { // 反時計回りで4点を渡す
        pushTri(a, b, c);
        pushTri(a, c, d);
      };

      pushQuad(sTL, sTR, eTR, eTL); // 上面
      pushQuad(sBR, sBL, eBL, eBR); // 底面
      pushQuad(sBL, sTL, eTL, eBL); // 左側面
      pushQuad(sTR, sBR, eBR, eTR); // 右側面

      const vertexCount = positions.length / 3;
      const texCoords = new Float32Array(vertexCount * 2); // テクスチャは使わないのでダミー値(0埋め)

      return {
        positions: { value: new Float32Array(positions), size: 3 },
        normals: { value: new Float32Array(normals), size: 3 },
        texCoords: { value: texCoords, size: 2 }
      };
    }

    function toggleRunway(id) {
      const rwy = YYC_RUNWAYS.find(r => r.id === id);
      if (rwy) {
        rwy.active = !rwy.active;
        document.getElementById(`btn-rwy-${id}`).classList.toggle('active', rwy.active);
        YYC_RUNWAYS = [...YYC_RUNWAYS]; 
        saveRadarSettings();
      }
    }


    // 管制圏の生成
    const YYC_CONTROL_ZONE = [
        { 
            id: "yyc-cz", group: "CZ-YYC", name: "CYYC Control Zone", type: "CYYC_CZ", 
            radius: 7 * NM_TO_M, startAngle: 0, endAngle: 360, 
            rawElevation: YYC_ALTITUDE*FT_TO_M, rawCeiling: 6600*FT_TO_M, color: [100, 118, 100] // 1084m〜2011m (6600ft ASL)
        },
        { 
            id: "ybw-cz", group: "CZ-YBW", name: "CYBW Springbank Control Zone", type: "CYBW_CZ", 
            radius: 5 * NM_TO_M, startAngle: 0, endAngle: 360, 
            rawElevation: YBW_ALTITUDE*FT_TO_M, rawCeiling: 5500*FT_TO_M, color: [0, 200, 100] 
        }
    ];


    function generateYYCControlZone(center, radiusMeters, startAngleDeg, endAngleDeg, elevationZ, pointsCount = 64) {
      const coordinates = [];
      const km = radiusMeters / 1000;
      const latFactor = km / 111.32;
      const lonFactor = km / (40075 * Math.cos(center[1] * Math.PI / 180) / 360);

      const startRad = ((90 - endAngleDeg) * Math.PI) / 180;
      const endRad = ((90 - startAngleDeg) * Math.PI) / 180;
      const angleRange = endRad - startRad;
      const isFullCircle = Math.abs(endAngleDeg - startAngleDeg) >= 360;

      if (!isFullCircle) coordinates.push([center[0], center[1], elevationZ]);

      for (let i = 0; i <= pointsCount; i++) {
          const angle = startRad + (i / pointsCount) * angleRange;
          const lon = center[0] + Math.cos(angle) * lonFactor;
          const lat = center[1] + Math.sin(angle) * latFactor;
          coordinates.push([lon, lat, elevationZ]);
      }

      if (!isFullCircle) coordinates.push([center[0], center[1], elevationZ]);
      else coordinates.push([coordinates[0][0], coordinates[0][1], elevationZ]);

      return coordinates;
    }
    
    function generateYBWControlZone(center, elevationZ, pointsCount = 64) {
        const coordinates = [];
        const radiusMeters = 5 * NM_TO_M;
        const km = radiusMeters / 1000;
        const latFactor = km / 111.32;
        const lonFactor = km / (40075 * Math.cos(center[1] * Math.PI / 180) / 360);
        const cutLongitude = -114.2833; 

        for (let i = 0; i <= pointsCount; i++) {
            const angle = (i * 2 * Math.PI) / pointsCount;
            let lon = center[0] + Math.cos(angle) * lonFactor;
            const lat = center[1] + Math.sin(angle) * latFactor;

            if (lon > cutLongitude) lon = cutLongitude;
            coordinates.push([lon, lat, elevationZ]);
        }
        coordinates.push([coordinates[0][0], coordinates[0][1], coordinates[0][2]]);
        return coordinates;
    }
    
    function generateAccurateTCAInner(center) {
      const [lonC, latC] = center;
      const WEST_LIMIT = -114.2833;
      const turfCenter = turf.point([lonC, latC]);

      const z4800 = 4800 * FT_TO_M * EXAGGERATION_FACTOR;
      const z5500 = 5500 * FT_TO_M * EXAGGERATION_FACTOR;
      const z6600 = 6600 * FT_TO_M * EXAGGERATION_FACTOR;
      const z12500 = 12500 * FT_TO_M * EXAGGERATION_FACTOR;

      const outerCircle = turf.circle(turfCenter, 15 * NM_TO_M/1000, { units: 'kilometers', steps: 64 });
      const innerCircle = turf.circle(turfCenter, 7 * NM_TO_M/1000, { units: 'kilometers', steps: 64 });
      const westCutter = turf.bboxPolygon([-116.0, latC - 1.5, WEST_LIMIT, latC + 1.5]);

      const polyPart3 = outerCircle; // 最上層
      const polyPart2 = turf.difference(outerCircle, innerCircle); // 中層
      const polyPart1 = turf.difference(polyPart2, westCutter); // 下層

      const horizontalFeatures = [];
      const verticalFeatures = []; // 💡 ここにきれいな垂直壁データを格納します

      // 補助関数: 指定した2Dライン（リング等）から、下限(zBottom)から上限(zTop)までの壁を生成する
      function buildWallFromLine(geojsonLine, zBottom, zTop) {
        // 安全のために追加
        if (!geojsonLine) return;
        const geom = geojsonLine.geometry || geojsonLine;
        if (!geom || !geom.coordinates) return;

        const coords = geom.coordinates;
        
        // MultiPolygonやPolygonから外周のリング座標を抽出
        let rings = [];
        if (geom.type === 'Polygon') {
          rings = coords;
        } else if (geom.type === 'MultiPolygon') {
          rings = coords.flat(1);
        } else {
          rings = [coords];
        }
        
        rings.forEach(ring => {
          if (!Array.isArray(ring) || ring.length < 2) return;

          for (let i = 0; i < ring.length - 1; i++) {
            const p1 = ring[i];
            const p2 = ring[i + 1];

            // 💡 解決策：上の2点（zTop）側だけ、緯度経度に極小のオフセットを加えます。
            // これにより完全な垂直ではなくなり、Deck.glの面消失バグを回避して面が描画されます。
            const offset = 0.000005; 
            
            // 垂直な4点閉路を1枚の壁ポリゴンとして登録
            verticalFeatures.push({
              type: "Feature",
              geometry: {
                type: "Polygon",
                coordinates: [[
                  [p1[0], p1[1], zBottom],
                  [p2[0], p2[1], zBottom],
                  [p2[0] + offset, p2[1] + offset, zTop], // 💡 わずかにずらす
                  [p1[0] + offset, p1[1] + offset, zTop], // 💡 わずかにずらす
                  [p1[0], p1[1], zBottom]
                ]]
              }
            });
          }
        });
      }

      // --- 💡 垂直な壁をピンポイントで生成する ---
      
      // 1. 【外周壁 (15マイル円)】: 4800ft（底面）から 12500ft（天井）まで一気に通す
      // ※西側のカット部分を除くため、polyPart1の外周（またはpolyPart2の外周）を利用します
      buildWallFromLine(polyPart3, z6600, z12500); // 15マイル円の最上部壁
      buildWallFromLine(polyPart2, z5500, z6600);   // 15マイル円の中段壁
      buildWallFromLine(polyPart1, z4800, z5500);   // 西側カットを反映した下段の外周壁

      // 2. 【内周壁 (7マイル円)】: 4800ft から 6600ft まで
      buildWallFromLine(innerCircle, z4800, z6600);

      // 3. 【ウエストリミットのカットラインの壁（西側のスパッと切れた断面）】: 4800ft から 5500ft まで
      // 西側カッター（westCutter）とouterCircleの交点部分に自動で壁が作られます（polyPart1の境界線から抽出されるため不要な設定なしで自動補完されます）


      // --- 水平な面（床・天井・段差）の生成 ---
      function createHorizontalFace(polygon, z) {
        if (!polygon) return;
        const geom = polygon.geometry || polygon;
        const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
        polys.forEach(rings => {
          const coords3d = rings.map(ring => ring.map(pt => [pt[0], pt[1], z]));
          horizontalFeatures.push({
            type: "Feature",
            geometry: {
              type: "Polygon",
              coordinates: coords3d
            }
          });
        });
      }

      // 水平面の生成（床・段差・天井）
      createHorizontalFace(polyPart1, z4800);     // 4800ft 底面
      createHorizontalFace(innerCircle, z6600);    // 6600ft 内側天井蓋
      createHorizontalFace(polyPart3, z12500);    // 12500ft 最上部天井

      // 5500ftの段差（polyPart2からpolyPart1を引いたドーナツ状の段差部分）
      const step5500 = turf.difference(polyPart2, polyPart1);
      createHorizontalFace(step5500, z5500);

      return {
        horizontal: turf.featureCollection(horizontalFeatures),
        vertical: turf.featureCollection(verticalFeatures) // 💡 綺麗な3D壁ポリゴン一式
      };
    }

    function generateAccurateTCAMiddle(center) {
      const [lonC, latC] = center;
      const turfCenter = turf.point([lonC, latC]);

      // 高度（メートル換算・倍率適用）
      const z5500 = 5500 * FT_TO_M * EXAGGERATION_FACTOR;
      const z6000 = 6000 * FT_TO_M * EXAGGERATION_FACTOR;
      const z8000 = 8000 * FT_TO_M * EXAGGERATION_FACTOR;
      const z12500 = 12500 * FT_TO_M * EXAGGERATION_FACTOR;

      // 1. 各種ベース円（マイル → キロメートル換算）
      const circle15 = turf.circle(turfCenter, 15 * NM_TO_M/1000, { units: 'kilometers', steps: 64 });
      const circle20 = turf.circle(turfCenter, 20 * NM_TO_M/1000, { units: 'kilometers', steps: 64 });
      const circle24 = turf.circle(turfCenter, 24 * NM_TO_M/1000, { units: 'kilometers', steps: 64 });

      // 2. 方位角セクター（236.5度 〜 326.5度）の生成
      const sectorWest = turf.sector(turfCenter, 24 * NM_TO_M/1000, 236.5, 326.5, { units: 'kilometers', steps: 64 });

      // --- 💡 修正：古いTurf.js仕様に合わせ、featureCollectionを使用せず直接2つを引数にします ---
      // パーツA: 半径15NM〜20NM、高度5500ft〜12500ft のドーナツ
      const polyPartA = turf.difference(circle20, circle15);

      // パーツB: 半径20NM〜24NM、高度6000ft〜8000ft の扇形ドーナツ
      const ring20_24 = turf.difference(circle24, circle20);
      
      // 💡 修正：交点抽出も古いTurf.jsに合わせて、1対1の直接の引数にします
      const polyPartB = turf.intersect(ring20_24, sectorWest);


      const horizontalFeatures = [];
      const verticalFeatures = [];

      // 3. 極小オフセット対応の壁生成関数
      function buildWallFromLine(geojsonLine, zBottom, zTop) {
        if (!geojsonLine) return;
        const geom = geojsonLine.geometry || geojsonLine;
        if (!geom || !geom.coordinates) return;

        const coords = geom.coordinates;
        let rings = [];
        if (geom.type === 'Polygon') {
          rings = coords;
        } else if (geom.type === 'MultiPolygon') {
          rings = coords.flat(1);
        } else {
          rings = [coords];
        }

        rings.forEach(ring => {
          if (!Array.isArray(ring) || ring.length < 2) return;

          for (let i = 0; i < ring.length - 1; i++) {
            const p1 = ring[i];
            const p2 = ring[i + 1];

            // 垂直面消失バグを防ぐため、上空側の座標に極小のオフセットをブレンド
            const offset = 0.000005;

            verticalFeatures.push({
              type: "Feature",
              geometry: {
                type: "Polygon",
                coordinates: [[
                  [p1[0], p1[1], zBottom],
                  [p2[0], p2[1], zBottom],
                  [p2[0] + offset, p2[1] + offset, zTop],
                  [p1[0] + offset, p1[1] + offset, zTop],
                  [p1[0], p1[1], zBottom]
                ]]
              }
            });
          }
        });
      }

      // --- 垂直な壁の生成 ---
      buildWallFromLine(polyPartA, z5500, z12500);
      buildWallFromLine(polyPartB, z6000, z8000);


      // --- 水平な面（床・天井）の生成 ---
      function createHorizontalFace(polygon, z) {
        if (!polygon) return;
        const geom = polygon.geometry || polygon;
        const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
        polys.forEach(rings => {
          const coords3d = rings.map(ring => ring.map(pt => [pt[0], pt[1], z]));
          horizontalFeatures.push({
            type: "Feature",
            geometry: {
              type: "Polygon",
              coordinates: coords3d
            }
          });
        });
      }

      // --- 水平面データのマッピング ---
      createHorizontalFace(polyPartA, z5500);
      createHorizontalFace(polyPartA, z12500);

      createHorizontalFace(polyPartB, z6000);
      createHorizontalFace(polyPartB, z8000);

      return {
        horizontal: turf.featureCollection(horizontalFeatures),
        vertical: turf.featureCollection(verticalFeatures)
      };
    }

    function generateAccurateTCAOuter(center) {
      const [lonC, latC] = center;
      const turfCenter = turf.point([lonC, latC]);

      // 高度（メートル換算・倍率適用）
      const z8000 = 8000 * FT_TO_M * EXAGGERATION_FACTOR;
      const z12500 = 12500 * FT_TO_M * EXAGGERATION_FACTOR;

      // 1. 各種ベース円（マイル → キロメートル換算）
      // Outerは半径24NMから30NMまでのドーナツ領域
      const circle24 = turf.circle(turfCenter, 20 * NM_TO_M/1000, { units: 'kilometers', steps: 64 });
      const circle30 = turf.circle(turfCenter, 30 * NM_TO_M/1000, { units: 'kilometers', steps: 64 });

      // 2. 2Dドーナツポリゴン（Outer領域）の生成
      const polyOuter = turf.difference(circle30, circle24);

      const horizontalFeatures = [];
      const verticalFeatures = [];

      // 壁生成用の共通ヘルパー（極小オフセット対応）
      function buildWallFromLine(geojsonLine, zBottom, zTop) {
        if (!geojsonLine) return;
        const geom = geojsonLine.geometry || geojsonLine;
        if (!geom || !geom.coordinates) return;

        const coords = geom.coordinates;
        let rings = [];
        if (geom.type === 'Polygon') {
          rings = coords;
        } else if (geom.type === 'MultiPolygon') {
          rings = coords.flat(1);
        } else {
          rings = [coords];
        }

        rings.forEach(ring => {
          if (!Array.isArray(ring) || ring.length < 2) return;

          for (let i = 0; i < ring.length - 1; i++) {
            const p1 = ring[i];
            const p2 = ring[i + 1];

            // 垂直面消失を防ぐ極小オフセット
            const offset = 0.000005;

            verticalFeatures.push({
              type: "Feature",
              geometry: {
                type: "Polygon",
                coordinates: [[
                  [p1[0], p1[1], zBottom],
                  [p2[0], p2[1], zBottom],
                  [p2[0] + offset, p2[1] + offset, zTop],
                  [p1[0] + offset, p1[1] + offset, zTop],
                  [p1[0], p1[1], zBottom]
                ]]
              }
            });
          }
        });
      }

      // --- 垂直な壁の生成 ---
      // 24NM〜30NM領域の、内壁(24NM)および外壁(30NM)を8,000ftから12,500ftまで作成
      buildWallFromLine(polyOuter, z8000, z12500);

      // --- 水平な面（床・天井）の生成 ---
      function createHorizontalFace(polygon, z) {
        if (!polygon) return;
        const geom = polygon.geometry || polygon;
        const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
        polys.forEach(rings => {
          const coords3d = rings.map(ring => ring.map(pt => [pt[0], pt[1], z]));
          horizontalFeatures.push({
            type: "Feature",
            geometry: {
              type: "Polygon",
              coordinates: coords3d
            }
          });
        });
      }

      // 水平床（8,000ft）と水平天井（12,500ft）の登録
      createHorizontalFace(polyOuter, z8000);
      createHorizontalFace(polyOuter, z12500);

      return {
        horizontal: turf.featureCollection(horizontalFeatures),
        vertical: turf.featureCollection(verticalFeatures)
      };
    }

    // 過去ログの取得
    async function loadInitialHistoricalData() {
      const requestHours = isActualMobile ? 2 : 24;
      try {
        console.log(`⏳ Loading ${requestHours} hours of history from server...`);
        const response = await fetch(`${HTTP_BASE}/api/history?hours=${requestHours}`);
        const data = await response.json();
        
        liveFlightPaths = {};
        data.forEach(msg => {

    }

    function processIncomingMessageToTarget(msg, targetObject) {
      if (!targetObject[msg.id]) {
        targetObject[msg.id] = {
          id: msg.id, callsign: 'UNKNOWN', airline: 'UNKNOWN', model: 'UNKNOWN',
          registration: '---', speed: '---', track: '---', v_rate: '---', segments: [[]] 
        };
      }

      const aircraft = targetObject[msg.id];

      if (msg.airline) aircraft.airline = msg.airline;
      if (msg.model) aircraft.model = msg.model;
      if (msg.registration) aircraft.registration = msg.registration;
      if (msg.callsign) aircraft.callsign = msg.callsign;
      if (msg.speed !== undefined) aircraft.speed = Math.round(msg.speed) + " kt";
      if (msg.track !== undefined) aircraft.track = Math.round(msg.track) + "°";
      if (msg.v_rate !== undefined) {
        aircraft.v_rate = (msg.v_rate > 0 ? "+" : "") + msg.v_rate + " ft/min";
      }

      if (msg.lat !== undefined && msg.lon !== undefined) {
        // rawAlt はここで一度だけNaNガードする（以降の描画では常にこの値 × 現在のEXAGGERATION_FACTORで計算するため、
        // ここが崩れると軌跡・マーカーとも高度がNaNになり得る）
        let safeRawAlt = Number(msg.alt);
        if (isNaN(safeRawAlt)) safeRawAlt = 0;
        // pos の高度成分は生値（未強調）で保持する。強調係数を焼き込むと、後で
        // EXAGGERATION_FACTOR を変更した際に「受信時点の係数」が古いまま残ってしまうため。
        // 実際の描画は常に rawAlt × 現在の EXAGGERATION_FACTOR で計算しており、pos[2] は参照していない。
        const newCoord = [msg.lon, msg.lat, safeRawAlt];
              
        let correctTs = Number(msg.ts);
        if (correctTs < 10000000000) correctTs *= 1000;

        let currentSegment = aircraft.segments[aircraft.segments.length - 1];
        if (!currentSegment) {
          aircraft.segments = [[]];
          currentSegment = aircraft.segments[0];
        }
        
        if (currentSegment.length === 0) {
          currentSegment.push({ pos: newCoord, rawAlt: safeRawAlt, time: correctTs });
        } else {
          const lastPoint = currentSegment[currentSegment.length - 1];
          if ((correctTs - lastPoint.time) > 1800 * 1000) {
            aircraft.segments.push([]);
            currentSegment = aircraft.segments[aircraft.segments.length - 1];
            currentSegment.push({ pos: newCoord, rawAlt: safeRawAlt, time: correctTs });
          } else {
            if (lastPoint.pos[0] !== msg.lon || lastPoint.pos[1] !== msg.lat) {
              currentSegment.push({ pos: newCoord, rawAlt: safeRawAlt, time: correctTs });
            }
          }
        }
      }

      if (selectedAircraftId === msg.id && flightPaths === targetObject) {
        updateDetailPanel(msg.id);
      }
    }

    async function saveCurrentTimespan() {
      if (viewMode !== 'realtime') return;
      
      let baseTime = Date.now();
      const startTimeStr = formatToCalgaryTime(baseTime + (sliderStartHours * 60 * 60 * 1000));
      const endTimeStr = formatToCalgaryTime(baseTime + (sliderEndHours * 60 * 60 * 1000));

      const confirmSave = confirm(`カルガリー時間 [ ${startTimeStr} 〜 ${endTimeStr} ] のスパンをサーバーに保存しますか？`);
      if (!confirmSave) return;

      try {
        const response = await fetch(`${HTTP_BASE}/api/archive/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start_hours: sliderStartHours, end_hours: sliderEndHours })
        });
        const resData = await response.json();
        if (resData.status === 'success') {
          alert(`✅ 保存に成功しました！\nファイル名: ${resData.filename}`);
          loadArchiveList(); 
        } else {
          alert(`❌ 保存失敗: ${resData.message}`);
        }
      } catch (e) {
        alert(`❌ サーバー接続エラー: ${e}`);
      }
    }

        select.innerHTML = '<option value="">-- アーカイブを選択 --</option>';

    async function loadSelectedArchive(filename) {
      if (!filename) return;
      try {
        console.log(`⏳ Loading archive file: ${filename}...`);
        const response = await fetch(`${HTTP_BASE}/api/archive/download?filename=${filename}`);
        currentArchiveData = await response.json();
        
        archiveFlightPaths = {}; 
        currentArchiveData.forEach(msg => { 
          processIncomingMessageToTarget(msg, archiveFlightPaths); 
        });
        flightPaths = archiveFlightPaths; 
        console.log(`✅ Archive parsed. Total paths: ${Object.keys(flightPaths).length}`);
        
        if (currentArchiveData.length > 0) {
          const timestamps = currentArchiveData.map(d => d.ts);
          let maxTs = Math.max(...timestamps);
          if (maxTs < 10000000000) maxTs *= 1000;
          let minTs = Math.min(...timestamps);
          if (minTs < 10000000000) minTs *= 1000;
          
          const durationHours = (maxTs - minTs) / (1000 * 60 * 60);
          const forbiddenHours = Math.max(24.0 - durationHours, 0);
          const safeStartPos = -Math.min(Math.max(durationHours, 0.1666), 24.0);

          rangeSlider.noUiSlider.updateOptions({
            range: { 'min': -24, 'max': 0 },
            padding: [forbiddenHours, 0],
            start: [safeStartPos, 0]
          });
          sliderStartHours = safeStartPos;
          sliderEndHours = 0.0;
        }
        
        updateAbsoluteTimeLabels();
      } catch (e) {
        console.error("❌ 過去ログの読み込みに失敗しました:", e);
      }
    }

    function updateAbsoluteTimeLabels() {
      let minRange = isActualMobile ? -2 : -24; 
      if (rangeSlider && rangeSlider.noUiSlider) {
        const options = rangeSlider.noUiSlider.options;
        if (options && options.range && typeof options.range.min === 'number') {
          minRange = options.range.min;
        }
      }

      const targetIds = ['label-left-time', 'label-min-range'];
      targetIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerText = `${minRange}h:`;
        }
      });

      let baseTime = Date.now();
      if (viewMode === 'archive' && currentArchiveData.length > 0) {
        let maxTs = Math.max(...currentArchiveData.map(d => d.ts));
        if (maxTs < 10000000000) maxTs *= 1000;
        baseTime = maxTs;
      }

      const minAbsoluteTime = baseTime + (minRange * 60 * 60 * 1000);
      const maxAbsoluteTime = baseTime;

      const startEl = document.getElementById('abs-start-time');
      const endEl = document.getElementById('abs-end-time');

      if (startEl) startEl.innerText = formatToCalgaryTime(minAbsoluteTime);
      if (endEl) endEl.innerText = formatToCalgaryTime(maxAbsoluteTime);
    }

    // UIから空域のON/OFF（チェックボックス等）が叩かれた際に呼び出すハンドラー
    function toggleAirspace(key) {
      if (airspaceVisibility[key] !== undefined) {
        // フラグを反転

        // ボタンのスタイルクラス（active）をトグル切り替え

        // Deck.gl Overlayを再描画
        if (typeof deckOverlay !== 'undefined') {

        }
